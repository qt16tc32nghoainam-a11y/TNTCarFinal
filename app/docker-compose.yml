services:
  tntcar:
    build: .
    image: tntcar:latest
    container_name: tntcar
    restart: unless-stopped
    ports:
      - "80:8080"          # truy cập qua http://EXTERNAL_IP/
    environment:
      PORT: "8080"
      JWT_SECRET: "doi-chuoi-bi-mat-nay-di"
      # DB lưu vào volume để dữ liệu KHÔNG mất khi container restart
      DB_PATH: "/data/tntcar.db"
      # SMTP: đặt các biến này trong file app/.env trên VM
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-TNT CAR <no-reply@tntcar.vn>}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:no-reply@tntcar.vn}"
    volumes:
      - tntcar_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tntcar_data:
